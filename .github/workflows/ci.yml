name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: brew install xcodegen

      - name: Cache the speech engine
        uses: actions/cache@v6
        with:
          path: |
            vendor/transcribe.cpp
            vendor/engine-dist
          key: engine-${{ runner.os }}-${{ hashFiles('scripts/build-engine.sh', 'vendor/patches/**') }}

      - name: Build
        run: scripts/build.sh Release

      - name: Run the logic checks
        run: build/Products/Release/Nabra.app/Contents/MacOS/Nabra --selftest
